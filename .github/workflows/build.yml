name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build the APK
        run: ./gradlew check assembleDebug

      - name: Name the APK
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk "alarm-clock-${version}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: alarm-clock-apk
          path: alarm-clock-*.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag may come from a git push or from drafting the release on GitHub,
        # so reuse the release if it already exists and just attach the APK.
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Alarm Clock $GITHUB_REF_NAME" \
              --notes "Install the APK on Android 7.0 or later. See the README for details."
          fi
          gh release upload "$GITHUB_REF_NAME" alarm-clock-*.apk --clobber
